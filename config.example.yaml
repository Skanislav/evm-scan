# evm-scan configuration.
#
# Copy to config.yaml and edit. Secrets are better supplied via the environment:
#   EVMSCAN_DATABASE_DSN, EVMSCAN_PUBLISHER_KEY, EVMSCAN_REGISTRY_ADDRESS, EVMSCAN_NODE

database:
  dsn: "postgres://evmscan:evmscan@127.0.0.1:5432/evmscan?sslmode=disable"
  auto_migrate: true

api:
  listen: "127.0.0.1:8080"
  cors_origin: ""
  # Lets the HTTP API add asset hints directly, bypassing the on-chain registry.
  # Handy locally; the on-chain HintRegistry is the real, auditable way in.
  allow_registration: false

# Resolving chain names through ENS's on.eth registry, so a network can be added by
# name rather than by chain id: POST /v1/chains {"ens_name":"base", "node":"…"}.
#
# The registry lives on Ethereum mainnet and holds identity only — a name, a chain id,
# a website, an icon. It publishes no RPC endpoints, which is right: an endpoint URL is
# where an API key lives. You always supply the node.
ens:
  # Off means chains can only be added by chain id, which is how most are added
  # anyway — most networks are not in the registry yet.
  disabled: false
  # Only needed when this deployment does not index mainnet itself. A read at head,
  # once per onboarding, and cross-checked against the node actually being indexed,
  # so a public endpoint is a reasonable thing to point it at.
  node: ""
  # Overrides the on.eth chain resolver. Empty uses the well-known deployment, which
  # is echoed in every response that used it.
  resolver: ""

registry:
  # The chain the HintRegistry is deployed on. It must also appear under `chains`.
  chain_id: 1
  address: ""
  # Signs index commitments. Prefer EVMSCAN_PUBLISHER_KEY over writing it here.
  publisher_key: ""
  sync_interval: 30s
  # Set > 0 to build and post a commitment on a timer. Identical roots are skipped.
  auto_publish_interval: 0
  commitment_uri: ""
  # The ENS name a HintResolver is attached under (docs/ENS.md), e.g. "evmscan.eth".
  # Set, account responses carry the account's hint name <hex>.hints.<parent>.
  # Informational only: nothing resolves through it here.
  # ens_parent: ""
  # How commitments reach the chain. "eoa" signs with publisher_key and pays its own
  # gas; the registry pays it back per block of funded coverage once an epoch finalizes
  # and its coverage is claimed.
  publisher:
    mode: eoa
    submit_timeout: 3m
    stale_after: 30m
    # Used when the node cannot estimate gas (a light client, say). 0 = fail instead.
    fallback_gas: 0
    # Do not post an epoch the registry values below this, in wei. Set it to what a
    # publish + finalize + claim costs in gas and unfunded chains stop costing you.
    # "0" or empty posts regardless.
    min_expected_reward_wei: "0"

chains:
  - chain_id: 1
    name: mainnet
    # YOUR OWN node: an IPC path, or ws:// / http:// on loopback.
    # A snap-synced geth is enough — this design never asks for historical state.
    node: "/var/lib/geth/geth.ipc"
    # Refuses to start against a non-loopback endpoint. Leave on unless you have
    # deliberately decided to depend on a third-party RPC.
    require_local_node: true
    # Depth at which events are folded into the rollup. Events shallower than this
    # stay in a buffer, so a reorg up to this depth cannot corrupt the index.
    confirmations: 12
    backfill_window: 5000
    tail_window: 1000
    poll_interval: 6s
    backfill_interval: 1s

    # Runtime discovery: watch the head for contracts nobody has registered.
    #
    # This is the only query that looks at every contract on the chain, and it stores
    # counters only — never per-account rows. A contract becomes expensive to index
    # exactly when it is promoted, not when it is noticed.
    discovery:
      enabled: true
      # Cold starts begin this far behind the head. Discovery never walks history:
      # history is what we spend *after* deciding a contract is worth indexing.
      lookback: 10000
      max_blocks_per_tick: 5000
      interval: 5s

      # Promote on activity alone. Off by default — promotion commits a full backfill,
      # and the on-chain HintRegistry is the authoritative "this contract matters"
      # signal. Turn it on to let the indexer bootstrap itself.
      auto_promote: false
      min_events: 100
      min_blocks: 25
      max_promotions_per_tick: 5

    # On-chain price discovery: Chainlink feeds and Uniswap pools, read through your
    # own node by a second deployless lens. No quote API is ever consulted.
    #
    # Everything here is optional. Mainnet, Optimism, Base and Arbitrum get their
    # well-known Feed Registry / native feed / factories / quote tokens filled in;
    # anything set below overrides the matching default. On another chain, or to
    # price through a Uniswap fork, set the addresses explicitly.
    # Token lists, fetched once at startup and compiled into a published membership
    # filter served at /v1/hints/tokens-<chain_id>.xorf.
    #
    # A reader downloads that file once and tests contracts against it in their own
    # browser, which is how a portfolio read drops airdrop spam without naming the
    # account to this deployment. The list is a hint about what is worth looking at
    # and never a source of truth: symbol, decimals and every number still come from
    # the chain, so a wrong or hostile list costs a wasted read and nothing more.
    #
    # These are the one third-party HTTP dependency in this process. A list that will
    # not fetch is logged and skipped rather than fatal.
    #
    # token_lists:
    #   - https://tokens.uniswap.org
    #   - https://tokens.coingecko.com/uniswap/all.json

    pricing:
      enabled: true
      # Why there are no prices here, in your words, for a chain with nothing to
      # read or with pricing off. The page shows it where a value would be.
      # note: "This chain has no feed registry and no liquidity worth quoting."
      # false drops the built-in addresses and uses only what is written here.
      use_defaults: true
      # feed_registry: "0x47Fb2585D2C56Fe188D0E6ec628a38b74fCeeeDf"   # mainnet only
      # native_usd_feed: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
      # feeds:                          # pin aggregators where there is no registry
      #   - token: "0x…"
      #     aggregator: "0x…"
      #     quote: usd                  # or native
      # uniswap_v3_factory: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
      # uniswap_v2_factory: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
      # fee_tiers: [100, 500, 3000, 10000]
      # quote_tokens:                   # replaces the defaults when set
      #   - address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
      #     symbol: WETH
      #     wrapped_native: true        # priced off the native/USD feed
      #   - address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      #     symbol: USDC
      #     assume_usd_peg: true        # 1 USD only when no feed covers it, and flagged
      # Averaging window asked of every v3 pool; each pool reports what it could give.
      twap_window: 30m
      # Shorter than this and a pool price is reported as low confidence, like a spot.
      min_twap_window: 10m
      # Older than this and a feed is stale: still reported, but outranked by a TWAP.
      max_feed_age: 25h
      # Prices change per block, so about one block time.
      cache_ttl: 12s
