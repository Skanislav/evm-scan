# Hosted deployment: Sepolia through a Helios light client running in the same
# container. Secrets come from the environment (see docs/RAILWAY.md):
#   EVMSCAN_DATABASE_DSN, EVMSCAN_REGISTRY_ADDRESS, EVMSCAN_PUBLISHER_KEY,
#   EVMSCAN_API_LISTEN (set by the entrypoint from $PORT).

database:
  dsn: ""
  auto_migrate: true

api:
  listen: "0.0.0.0:8080"
  cors_origin: "*"
  allow_registration: false
  # Guards the endpoints that spend: publishing an epoch, promoting an asset,
  # registering one. Empty leaves them open, which is only defensible while there is
  # no publisher key. Set EVMSCAN_API_TOKEN on the deployment rather than here.
  auth_token: ""

registry:
  chain_id: 11155111
  address: ""
  publisher_key: ""
  sync_interval: 60s
  # Post a commitment on a timer. Identical roots are skipped, so this is an upper
  # bound on how often gas is spent, not a guarantee that it is.
  auto_publish_interval: 30m
  commitment_uri: "https://evm-scan-sepolia.up.railway.app/v1/epochs/{id}/snapshot"
  ens_parent: "evm-scan.eth"
  publisher:
    mode: eoa
    submit_timeout: 3m
    stale_after: 30m
    # Helios may not implement eth_estimateGas; publishIndex, finalizeIndex and a
    # claimCoverage over a handful of assets all fit comfortably in this.
    fallback_gas: 400000
    # Roughly what those three transactions cost on Sepolia at a few gwei. An epoch
    # whose funded coverage is worth less than this is not posted.
    min_expected_reward_wei: "10000000000000"

chains:
  - chain_id: 11155111
    name: sepolia
    # Helios, started by deploy/entrypoint.sh, on loopback. It verifies every
    # answer against beacon headers, so this is honestly our own node.
    node: "http://127.0.0.1:8545"
    require_local_node: true
    confirmations: 6
    # Helios proves logs for at most 4096 blocks per eth_getLogs, but that ceiling is
    # never what binds. Two things bite first, both measured against Sepolia through
    # Ankr: the upstream caps a response (Ankr at 10 MB, Alchemy's free tier at a
    # 10-block range), and Helios caps its own ("Memory capacity exceeded" out of
    # jsonrpsee). Sepolia log density swings wildly — 10,002 logs in a 3-block range
    # at one depth, 853 at another — so the safe window is small and flat. At 2000/500
    # every discovery tick failed and the index stayed empty; at these numbers
    # discovery promoted its first assets within 90 seconds.
    backfill_window: 20
    tail_window: 10
    poll_interval: 12s
    backfill_interval: 3s

    # Prices are read with a second deployless call, and on a light client that
    # verifies every slot it touches — about a minute for a cold read on mainnet.
    # The 12s default assumes a local node and would re-read on nearly every
    # request; hold quotes long enough that the slow path is rare. Nothing about
    # pricing touches the commitment, so a slightly old quote costs nothing.
    pricing:
      cache_ttl: 10m
      # Sepolia has no built-in sources and none are named here, so nothing is
      # valued; this is what the page says instead of an empty column.
      note: "Sepolia has no feed registry and no liquidity worth quoting, so holdings here carry no value."

    discovery:
      enabled: true
      # Helios can only verify blocks the EIP-2935 history contract still covers,
      # roughly the last 8191. Looking back further would just probe the floor.
      lookback: 6000
      # Same ceiling as the windows above. Catching up 6000 blocks at this size takes
      # a little over an hour on a cold start; the alternative is a tick that always
      # fails, which never catches up at all.
      max_blocks_per_tick: 20
      interval: 15s
      # Index first, register later: promote on activity alone, and let an on-chain
      # requestIndexing make it durable and funded. Thresholds are high because
      # Sepolia is full of spam tokens and every promotion costs a verified backfill.
      auto_promote: true
      min_events: 200
      min_blocks: 50
      max_promotions_per_tick: 2
