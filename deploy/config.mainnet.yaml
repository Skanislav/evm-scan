# Hosted deployment: Ethereum mainnet through a Helios light client running in the
# same container. Secrets come from the environment (see docs/MAINNET.md):
#   EVMSCAN_DATABASE_DSN, EVMSCAN_REGISTRY_ADDRESS, EVMSCAN_PUBLISHER_KEY,
#   EVMSCAN_API_LISTEN (set by the entrypoint from $PORT).
#
# Read docs/MAINNET.md before using this. The short version: Helios can verify
# roughly the last 8191 blocks (EIP-2935), which on mainnet is about 27 hours. This
# configuration therefore indexes a rolling day of mainnet and reports
# history_complete: false on everything. That is a real product for "what has this
# address touched lately" and not one for "what has this address ever touched"; the
# latter needs an archive- or full-node deployment, not Railway.

database:
  dsn: ""
  auto_migrate: true

api:
  listen: "0.0.0.0:8080"
  cors_origin: "*"
  # Mainnet: a promotion costs a verified backfill against a paid RPC quota, so the
  # open registration endpoint is off. Assets arrive through requestIndexing, which
  # is the path that pays for them.
  allow_registration: false

registry:
  chain_id: 1
  address: ""
  publisher_key: ""
  sync_interval: 60s
  # Mainnet gas is the dominant cost, so post on a slower timer than Sepolia and let
  # min_expected_reward_wei decide whether a given epoch is worth it at all.
  auto_publish_interval: 6h
  commitment_uri: ""
  publisher:
    mode: eoa
    submit_timeout: 10m
    stale_after: 2h
    # Only used when Helios cannot estimate. This is sized for oracle mode, where
    # publishIndex pulls the bond with transferFrom, approves the oracle and calls
    # UMA's assertTruth on top of its own storage writes. Confirm it against a real
    # receipt on Sepolia in oracle mode before trusting it here; too low burns the
    # gas and reverts, too high only reserves headroom.
    fallback_gas: 1200000
    # Publish + finalize + claim is roughly 1.5M gas across three transactions. At
    # 10 gwei that is ~0.015 ETH, so an epoch worth less than that costs the
    # publisher money. Raise this with the gas price you are actually seeing.
    min_expected_reward_wei: "20000000000000000"

chains:
  - chain_id: 1
    name: mainnet
    # Helios, started by deploy/entrypoint.sh, on loopback. It verifies every answer
    # against beacon headers, so this is honestly our own node.
    node: "http://127.0.0.1:8545"
    require_local_node: true
    # ~2.5 minutes. Mainnet reorgs past two epochs are a consensus failure, not an
    # operating condition, but commitments are bonded, so pay for the depth.
    confirmations: 12
    # Helios's 4096-block eth_getLogs ceiling is never what binds; the response size
    # is. Measured cold against mainnet through Ankr (10 MB cap), discovery topics
    # unfiltered by address: 10 blocks is 4.6 MB, 20 blocks is 6-8.6 MB depending on
    # depth, and 50 blocks is refused outright. Latency is not the problem — the
    # 20-block call takes two seconds — so this is sized for the cap, with room for
    # the density swing, not for time.
    backfill_window: 10
    tail_window: 10
    poll_interval: 12s
    backfill_interval: 5s

    discovery:
      enabled: true
      # Inside the ~8191-block window Helios can verify, with room for the daemon to
      # have been restarted.
      lookback: 6000
      # Same cap. A cold start walks 6000 blocks at ten per tick; at the interval
      # below that is under an hour, and every tick actually completes.
      max_blocks_per_tick: 10
      interval: 30s
      # Off by default on mainnet. Every promotion spends verified RPC quota on a
      # backfill nobody has paid for, and the funded path — requestIndexing — is the
      # one that reimburses it. Turn this on only if you are sponsoring the gas.
      auto_promote: false
      min_events: 2000
      min_blocks: 500
      max_promotions_per_tick: 1
