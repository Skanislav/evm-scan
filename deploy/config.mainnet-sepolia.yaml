# Hosted deployment: index Ethereum mainnet through a Helios light client, and
# commit the result to a HintRegistry on Sepolia.
#
# Why the split. The registry never asks which chain it is on: publishIndex takes a
# chainId, assetKey and contractsOf take a chainId, Epoch stores one, and
# block.chainid appears nowhere in HintRegistry.sol. A commitment is a statement
# about a chain, not a statement made on it — so the index can be mainnet's while
# the bond, the challenge window and the gas live somewhere they cost less.
# docs/TOKENOMICS.md section 6.2 is the argument for doing that.
#
# What it costs. The container runs one Helios, so mainnet gets the verified node
# and Sepolia is reached over an ordinary RPC with require_local_node off. That is a
# real concession and worth being precise about: the index is still built entirely
# from Helios-verified mainnet logs, and the root is derived locally from them. What
# becomes trust-me is reading registry state and submitting transactions. A lying
# Sepolia RPC can mislead this daemon about an epoch's status; it cannot forge a root
# or corrupt the index.
#
# Why Sepolia and not Base. The bond, the challenge window and the gas are what a
# registry chain supplies, and a local-arbiter registry with a zero bond supplies
# none of them for real on either chain: one key settles every dispute, so the money
# on Base was buying nothing the testnet does not also give. Moving it to Sepolia
# also puts the registry on the same chain as the ENSv2 name this deployment holds
# (5can.eth, the state checkpoint below), which is one chain to fund and one RPC to
# keep alive instead of two. A deployment that wants disputes to cost something
# belongs in oracle mode on a chain with an optimistic oracle — docs/MAINNET.md §5.
#
# Chain order matters. The API answers a request without an explicit chain_id with
# the first chain listed here, so mainnet is first and Sepolia second. Sepolia
# carries no indexing of its own.
#
# Secrets come from the environment (see docs/MAINNET.md):
#   EVMSCAN_DATABASE_DSN, EVMSCAN_REGISTRY_ADDRESS, EVMSCAN_PUBLISHER_KEY,
#   EVMSCAN_NODE_11155111 (the Sepolia RPC),
#   EVMSCAN_STATE_PUBLISHER_KEY and EVMSCAN_STATE_NODE (the checkpoint sender),
#   EVMSCAN_API_LISTEN (set by the entrypoint from $PORT).
database:
  dsn: ""
  auto_migrate: true

# The aggregate state checkpoint (docs/USER_STATE.md). One trie over every account's
# latest signed revision, its root written as an ENS text record so a reader can find
# their own snapshot without trusting this deployment's database. ENSv2 only exists on
# Sepolia, so this is a third chain the daemon touches — for one setText every ten
# minutes and nothing else. It reads no logs and holds no index.
#
# 5can.eth is the operator name; its resolver is the ENSv2 dedicated resolver that
# name already points at, and the sender below is granted ROLE_SET_TEXT scoped to
# `evmscan.states` alone (docs/MAINNET.md §6f). EVMSCAN_STATE_PUBLISHER_KEY must be a
# dedicated key — the daemon refuses to start if it matches the index publisher —
# and EVMSCAN_STATE_NODE is a Sepolia RPC. Both come from the environment.
state:
  enabled: true
  name: "5can.eth"
  resolver: "0x9Ce32cC42fd5aa0a1a30B2507248A9bcbd2893Cb"
  # Sepolia is not the chain Helios verifies, so there is no local node to require.
  # Nothing in a commitment depends on this endpoint: it carries a root that was
  # already derived and signed locally, and the browser verifies the record through
  # ENS rather than through us.
  node: ""
  require_local_node: false
  interval: 10m
  # A cap, not an estimate. Estimation must succeed or publication defers; these two
  # bound what a single setText can ever cost at 0.003 ETH.
  max_gas: 300000
  max_fee_wei: "10000000000"

api:
  listen: "0.0.0.0:8080"
  cors_origin: "*"
  # Mainnet: a promotion costs a verified backfill against a paid RPC quota, so the
  # open registration endpoint is off. Assets arrive through requestIndexing, which
  # is the path that pays for them.
  allow_registration: false
  # Guards the endpoints that spend: publishing an epoch, promoting an asset,
  # registering one. Empty leaves them open, which is only defensible while there is
  # no publisher key. Set EVMSCAN_API_TOKEN on the deployment rather than here.
  auth_token: ""

registry:
  # Sepolia. Not the chain being indexed — see the header.
  chain_id: 11155111
  address: ""
  publisher_key: ""
  sync_interval: 60s
  # How often a *new* commitment is built. Sepolia gas is free, so what bounds this
  # is not the gas but the ~2M leaf rows an epoch writes. Identical roots are
  # skipped either way.
  #
  # Settling — finalizing what is past its challenge window and claiming the
  # coverage that makes — is not on this clock. It runs on sync_interval above,
  # because it is idempotent and sends nothing when nothing is due, and because
  # settling on the build clock would leave a 600-second window proposed for the
  # rest of the hour.
  auto_publish_interval: 1h
  # ENS. Every account gets <hex>.hints.<ens_parent>. 5can.eth is the name this
  # operator actually holds — on ENSv2 Sepolia, which is also where the state
  # checkpoint above is written. No resolver serves <hex>.hints.5can.eth yet: the
  # HintSignedResolver (contracts/src/HintSignedResolver.sol) is built and
  # sim-tested but undeployed (docs/SHIP.md D2), so ens_parent only lets account
  # responses carry hint_name. If it is ever deployed, set ens_resolver from
  # EVMSCAN_ENS_RESOLVER (docs/MAINNET.md §6d); until then the gateway signs for
  # any sender. The resolver's gateway template would be
  #   https://evm-scan-production.up.railway.app/ens/{sender}/{data}.json
  ens_parent: "5can.eth"
  ens_resolver: ""
  # Where the full index table for a commitment is published. A root proves a leaf
  # to whoever already holds it and recovers nothing on its own, so an epoch whose
  # data lives only in this deployment's Postgres dies with that database. This
  # pointer is stored in the epoch and emitted in IndexPublished, so a recovery
  # starts from the chain: read the uri, fetch the table, rebuild both trees, check
  # them against the roots (evmscan-verify -snapshot), then evmscan-restore.
  #
  # {id} is this deployment's epoch id, which GET /v1/epochs/{id}/snapshot takes.
  # Serving it from the daemon is the availability floor, not the goal: the file is
  # self-authenticating against the chain, so it should be mirrored somewhere that
  # outlives this service. Whoever holds a copy can hand it to anyone.
  commitment_uri: "https://evm-scan-production.up.railway.app/v1/epochs/{id}/manifest"
  publisher:
    mode: eoa
    submit_timeout: 10m
    stale_after: 2h
    # Only used when Helios cannot estimate. This is sized for oracle mode, where
    # publishIndex pulls the bond with transferFrom, approves the oracle and calls
    # UMA's assertTruth on top of its own storage writes. Confirm it against a real
    # receipt on Sepolia in oracle mode before trusting it here; too low burns the
    # gas and reverts, too high only reserves headroom.
    fallback_gas: 1200000
    # Publish + finalize + claim is roughly 1.5M gas across three transactions. On
    # Sepolia that gas is worth nothing, so this guard is not protecting money — it
    # is only stopping the daemon posting an epoch no asset has funded. Kept at the
    # Base figure so the same profile means the same thing if the registry ever
    # moves back to a chain where gas costs something; docs/MAINNET.md section 2 is
    # how to confirm it against real receipts there.
    min_expected_reward_wei: "20000000000000"

# What the RPC bill is made of. Providers meter per request, so the only lever on
# cost is how many requests this daemon makes — which is what /v1/status reports,
# per chain, alongside the money.
#
# cu_per_request is measured, not assumed: on dRPC, 32,780 CU over 1,639 requests
# and 40,780 over 2,039 are both exactly 20 CU per call, on two different chains,
# so the unit is flat per request rather than per method.
#
# usd_per_million_cu has to come from the plan in use. The dashboard rounds to the
# cent, which only bounds it: two readings of $0.01 put the rate somewhere between
# $0.15 and $0.37 per million CU, and this is the middle of that. Replace it with
# the real figure before quoting any of these numbers at anyone.
#
# Note that only a chain dialled directly has counts that are also its bill. The
# mainnet leg goes through Helios on loopback, and the provider bills for what
# Helios fetches upstream to verify each answer — several requests per call, none
# of them visible from inside this process. /v1/status flags that per chain.
cost:
  cu_per_request: 20
  usd_per_million_cu: 0.26

chains:
  - chain_id: 1
    name: mainnet
    # Helios, started by deploy/entrypoint.sh, on loopback. It verifies every answer
    # against beacon headers, so this is honestly our own node.
    node: "http://127.0.0.1:8545"
    require_local_node: true
    # ~2.5 minutes. Mainnet reorgs past two epochs are a consensus failure, not an
    # operating condition, but commitments are bonded, so pay for the depth.
    confirmations: 12
    # Helios's 4096-block eth_getLogs ceiling is never what binds; the response size
    # is. Measured cold against mainnet through Ankr (10 MB cap), discovery topics
    # unfiltered by address: 10 blocks is 4.6 MB, 20 blocks is 6-8.6 MB depending on
    # depth, and 50 blocks is refused outright. Latency is not the problem — the
    # 20-block call takes two seconds — so this is sized for the cap, with room for
    # the density swing, not for time.
    backfill_window: 10
    tail_window: 10
    poll_interval: 12s
    backfill_interval: 5s

    # Prices are read with a second deployless call, and on a light client that
    # verifies every slot it touches — about a minute for a cold read on mainnet.
    # The 12s default assumes a local node and would re-read on nearly every
    # request; hold quotes long enough that the slow path is rare. Nothing about
    # pricing touches the commitment, so a slightly old quote costs nothing.
    pricing:
      cache_ttl: 10m

    discovery:
      enabled: true
      # Inside the ~8191-block window Helios can verify, with room for the daemon to
      # have been restarted.
      lookback: 6000
      # Same cap. A cold start walks 6000 blocks at ten per tick; at the interval
      # below that is under an hour, and every tick actually completes.
      max_blocks_per_tick: 10
      interval: 30s
      # Off by default on mainnet. Every promotion spends verified RPC quota on a
      # backfill nobody has paid for, and the funded path — requestIndexing — is the
      # one that reimburses it. Turn this on only if you are sponsoring the gas.
      auto_promote: false
      min_events: 2000
      min_blocks: 500
      max_promotions_per_tick: 1
      # Demand can promote on its own: a contract whose net signers
      # (for − against, from signed verdicts through POST /v1/verdict, the +1
      # legacy POST /v1/demand, or HintRegistry.vote) reach this number is indexed
      # whether or not it is busy, one per tick. 1 is the demo-day value
      # (docs/SHIP.md D4): a single recognized-but-unindexed token gets indexed
      # within a tick. 3 is the metered-node value, so a single fresh address
      # cannot buy a backfill on the verified quota for free; restore it after.
      min_voters: 1

    # Two lists, merged into one membership filter and published at /v1/hints. This
    # is the only third-party HTTP this process does, it happens once at startup, and
    # a list that will not fetch is logged and skipped — an optional hint is never a
    # reason a deployment refuses to come up.
    #
    # Both, rather than either, because the filter only ever *annotates*. Nothing is
    # dropped for missing from it, so the cost of a broader list is a few more keys in
    # a file that is already small, while the cost of a narrower one is a real
    # long-tail holding flagged as junk in front of whoever holds it. Uniswap's list
    # is the curated core; CoinGecko's is the long tail, and the union is what lets
    # "nobody vouched for this" mean something.
    token_lists:
      - https://tokens.uniswap.org
      - https://tokens.coingecko.com/uniswap/all.json

  # Sepolia: present so the daemon can read the registry and send its transactions.
  # Nothing here is indexed — no discovery, and no assets will ever be registered
  # against chain 11155111 unless someone asks for them explicitly.
  #
  # It is also the chain the state checkpoint writes to, from a different sender.
  # The two never share a nonce because they never share a key: the daemon refuses
  # to start if state.publisher_key matches registry.publisher_key.
  - chain_id: 11155111
    name: sepolia
    # An ordinary RPC. The one Helios in this container is spent on mainnet, and
    # Sepolia is not what the commitments are about.
    node: ""
    require_local_node: false
    confirmations: 12
    backfill_window: 200
    tail_window: 100
    # Sepolia carries no index of its own, so this leg only exists to read the
    # registry and send to it. Polling it on the block time buys nothing and, against
    # a public or metered endpoint, is what actually spends the quota: a rate-limited
    # Sepolia RPC takes down more than Sepolia, because one indexer's failure cancels
    # the context the mainnet indexer and the publisher share. Poll on the registry's
    # own cadence.
    poll_interval: 30s
    backfill_interval: 60s

    discovery:
      enabled: false
      auto_promote: false
